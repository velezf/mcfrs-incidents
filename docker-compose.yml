# Local development + small-host deployment.
#   docker compose up -d db          dev: Postgres only (API via `cd api && uv run uvicorn ...`, web via `npm run dev`)
#   docker compose up -d --build     everything: db + api (Python) + web (Next)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mcfrs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcfrs-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-mcfrs}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcfrs} -d ${POSTGRES_DB:-mcfrs}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mcfrs}:${POSTGRES_PASSWORD:-mcfrs-dev-only}@db:5432/${POSTGRES_DB:-mcfrs}
      CORS_ORIGINS: http://localhost:${APP_PORT:-3000}
    volumes:
      - hydrants:/app/var
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build: .
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
      PORT: "3000"
    depends_on:
      - api
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
  hydrants:
