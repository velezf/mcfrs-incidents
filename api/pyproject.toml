[project]
name = "mcfrs-api"
version = "0.1.0"
description = "MCFRS Incident Dashboard backend: source adapters, normalizer, storage, API."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "greenlet>=3.5.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcfrs_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"mcfrs_api/adapters/mock_fixtures.py" = ["E501"]
"mcfrs_api/adapters/mock.py" = ["E501"]
"mcfrs_api/routes/*.py" = ["B008"]  # FastAPI Depends()/Query() defaults are the idiom
